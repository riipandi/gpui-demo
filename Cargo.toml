[workspace]
members = ["crates/ui", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false

[workspace.lints.rust]
future_incompatible = "allow"

[workspace.dependencies]
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d", features = ["font-kit", "wayland", "x11"] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d" }
base-gpui = { git = "https://github.com/LukeTandjung/base-gpui" }

# WebView dependencies
gpui-wry = { git = "https://github.com/longbridge/gpui-component" }
raw-window-handle = { version = "0.6", features = ["std"] }
wry = { version = "0.53.3", package = "lb-wry" }

anyhow = "1.0.104"
reqwest = { version = "0.13.4" }
rio-vt = { version = "0.5.20", features = ["clipboard", "graphics"] }
rust-embed = { version = "8", features = ["include-exclude"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = { version = "2.0.20" }
tokio = { version = "1" }

# Workspace crates
ui = { path = "crates/ui" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 64
debug = "limited"

[profile.release]
debug = "limited"
lto = false
codegen-units = 1
